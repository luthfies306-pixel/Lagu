<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 Pemutar Suara</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #0b1120, #1a253b);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      padding: 30px 25px 35px;
      max-width: 370px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
      transition: transform 0.25s ease;
    }

    .player-card:hover {
      transform: translateY(-5px);
    }

    .cover-icon {
      width: 150px;
      height: 150px;
      margin: 0 auto 16px;
      border-radius: 30px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      box-shadow: 0 12px 30px rgba(79, 172, 254, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      color: #fff;
      user-select: none;
    }

    h2 {
      color: #f0f4ff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .sub {
      color: #9aafd4;
      font-size: 14px;
      font-weight: 300;
      margin-bottom: 22px;
    }

    /* Tombol putar besar */
    .play-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: #fff;
      font-size: 36px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(79, 172, 254, 0.5);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .play-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 12px 35px rgba(79, 172, 254, 0.7);
    }

    .play-btn:active {
      transform: scale(0.94);
    }

    /* Progress bar */
    .progress-wrap {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      border-radius: 10px;
      transition: width 0.15s linear;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      color: #7a8bb0;
      font-size: 12px;
      font-weight: 300;
      margin-top: 6px;
    }

    /* Audio disembunyikan */
    audio {
      display: none;
    }

    @media (max-width: 400px) {
      .player-card { padding: 22px 16px 28px; }
      .cover-icon { width: 130px; height: 130px; font-size: 50px; }
      .play-btn { width: 68px; height: 68px; font-size: 30px; }
    }
  </style>
</head>
<body>

  <div class="player-card">

    <div class="cover-icon">🎵</div>

    <h2>Lagu terbaik!</h2>
    <p class="sub">Putar rekaman</p>

    <button class="play-btn" id="playBtn">▶</button>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="time-info">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>

  </div>

  <audio id="audioPlayer" src="tiktokio.com1784960437_b4pSi8cuBm9wMD52GmtU.mp3"></audio>

  <script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const progressBar = document.getElementById('progressBar');
    const currentTimeSpan = document.getElementById('currentTime');
    const totalTimeSpan = document.getElementById('totalTime');

    function formatTime(sec) {
      if (isNaN(sec) || !isFinite(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function updateProgress() {
      if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = percent + '%';
        currentTimeSpan.textContent = formatTime(audio.currentTime);
        totalTimeSpan.textContent = formatTime(audio.duration);
      }
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = '⏸';
      } else {
        audio.pause();
        playBtn.textContent = '▶';
      }
    }

    playBtn.addEventListener('click', togglePlay);

    audio.addEventListener('timeupdate', updateProgress);

    audio.addEventListener('loadedmetadata', () => {
      totalTimeSpan.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      playBtn.textContent = '▶';
      progressBar.style.width = '0%';
      currentTimeSpan.textContent = '0:00';
    });

    // Inisialisasi
    updateProgress();
  </script>

</body>
</html>
